[project]
name = "fiscaliza"
version = "0.1.0"
description = "Cruzamento de bases públicas brasileiras para índices de risco em contratações e mandatos, com camada de IA plugável"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "networkx>=3.2",
    "typer>=0.12",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40", "openai>=1.50"]
neo4j = ["neo4j>=5.20"]

[project.scripts]
fiscaliza = "fiscaliza.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
